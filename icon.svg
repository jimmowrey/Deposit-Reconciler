<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Deposit Reconciler icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#169447"/>
      <stop offset="1" stop-color="#075a2e"/>
    </linearGradient>
    <linearGradient id="money" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79ee38"/>
      <stop offset="1" stop-color="#22ba24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#003a1d" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(-25.6 -25.6) scale(1.10)">
    <!-- Card -->
    <g transform="translate(38 78) rotate(-9 90 70)" filter="url(#shadow)">
      <rect width="176" height="126" rx="22" fill="#0c4d31" stroke="#5cbf7d" stroke-width="4"/>
      <rect y="27" width="176" height="22" fill="#277d50"/>
      <rect x="25" y="63" width="42" height="30" rx="6" fill="#f3c94d"/>
      <path d="M46 63v30M25 78h42" stroke="#b88c19" stroke-width="3"/>
      <rect x="25" y="103" width="72" height="7" rx="4" fill="#79d99b"/>
    </g>

    <!-- Receipt -->
    <g transform="translate(335 67) rotate(7 58 82)" filter="url(#shadow)">
      <path d="M0 0h116v162l-14-10-14 10-14-10-14 10-14-10-14 10-16-10-16 10z" fill="#fff"/>
      <path d="M18 34h80M18 58h67M18 82h76M18 106h50" stroke="#166f3d" stroke-width="9" stroke-linecap="round"/>
      <text x="76" y="135" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="#17943f">$</text>
    </g>

    <!-- Bank -->
    <g transform="translate(52 319)" filter="url(#shadow)" fill="#fff">
      <path d="M0 35 87 0l87 35v16H0z"/>
      <rect x="13" y="61" width="20" height="82" rx="3"/>
      <rect x="55" y="61" width="20" height="82" rx="3"/>
      <rect x="99" y="61" width="20" height="82" rx="3"/>
      <rect x="141" y="61" width="20" height="82" rx="3"/>
      <rect x="0" y="146" width="174" height="17" rx="5"/>
    </g>

    <!-- Calculator -->
    <g transform="translate(334 304) rotate(8 62 88)" filter="url(#shadow)">
      <rect width="126" height="176" rx="22" fill="#222d35" stroke="#4b5963" stroke-width="4"/>
      <rect x="15" y="16" width="96" height="38" rx="9" fill="#aad7a9"/>
      <text x="101" y="44" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#175e32">123.45</text>
      <g fill="#697782">
        <rect x="17" y="70" width="25" height="25" rx="6"/><rect x="50" y="70" width="25" height="25" rx="6"/><rect x="83" y="70" width="25" height="25" rx="6"/>
        <rect x="17" y="103" width="25" height="25" rx="6"/><rect x="50" y="103" width="25" height="25" rx="6"/><rect x="83" y="103" width="25" height="25" rx="6"/>
        <rect x="17" y="136" width="25" height="25" rx="6"/><rect x="50" y="136" width="25" height="25" rx="6"/>
      </g>
      <rect x="83" y="136" width="25" height="25" rx="6" fill="#38cf2c"/>
      <path d="M90 148h11" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Growth arrow -->
    <g filter="url(#shadow)" fill="none" stroke="#91ef42" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M122 442l65-61 54 43 80-83"/>
      <path d="M291 343h36v36"/>
    </g>

    <!-- Central dollar -->
    <text x="256" y="333" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="286" font-weight="900" fill="url(#money)" stroke="#fff" stroke-width="13" paint-order="stroke" filter="url(#shadow)">$</text>
  </g>
</svg>
